# PocketDrive 部署:单个容器。
#
# aria2 / yt-dlp / ffmpeg 都由 PocketDrive 自己管理(装在 config 卷里),
# 在网页「设置 → 组件状态」里各自升级,不需要再单独跑一个 aria2 容器。
#
# 两种用法:
#   A. 直接用官方镜像(推荐,VPS 上无需编译):保持 image 行不动
#   B. 自己改了代码想本地构建:注释掉 image 行,取消 build 三行的注释
#
# 使用前:把 POCKETDRIVE_ADMIN_PASSWORD 改成自己的值(或在同目录建 .env 写入)
services:
    pocketdrive:
        image: ghcr.io/lqlcj/pocketdrive:latest
        # build:
        #     context: ..
        #     dockerfile: docker/Dockerfile
        container_name: pocketdrive
        restart: unless-stopped
        ports:
            - '16688:16688'
            # aria2 的 BT 监听端口(不开也能下载,只是冷门种子慢)
            - '6888:6888'
            - '6888:6888/udp'
        environment:
            - POCKETDRIVE_DATA_DIR=/data
            - POCKETDRIVE_DB=/config/pocketdrive.db
            - POCKETDRIVE_ADMIN_USER=${POCKETDRIVE_ADMIN_USER:-admin}
            # 留空则首次启动随机生成并打印在容器日志里
            - POCKETDRIVE_ADMIN_PASSWORD=${POCKETDRIVE_ADMIN_PASSWORD:-}
        volumes:
            - ./data:/data
            - ./config:/config
# 从旧版(pocketdrive + aria2 两个容器)升级上来:
# 直接换成这份即可,原来的 aria2 容器可以停掉删除,下载历史存在配置库里不受影响。
# 如果你想继续用外部的 aria2,给 pocketdrive 加上
#   - POCKETDRIVE_ARIA2_RPC=http://aria2:6800/jsonrpc
#   - POCKETDRIVE_ARIA2_SECRET=你的密钥
# 它就不会启动内置的 aria2。
