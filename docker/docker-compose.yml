# PocketDrive 部署:pocketdrive + aria2 两个容器,共享同一个 /data(整个网盘目录)
#
# 两种用法:
#   A. 直接用官方镜像(推荐,VPS 上无需编译):保持 image 行不动
#   B. 自己改了代码想本地构建:注释掉 image 行,取消 build 三行的注释
#
# 使用前:在同目录 .env 中设置 ARIA2_SECRET、POCKETDRIVE_ADMIN_PASSWORD
# 和随机的 POCKETDRIVE_UPDATER_TOKEN。
#
# 以后怎么更新:
#   yt-dlp        网页 → 设置 → 组件状态 → 升级(装在 config 卷里,重启不丢)
#   其余全部      cd 到本目录,docker compose pull && docker compose up -d
#                 (会一起更新 PocketDrive 本体、ffmpeg 和 aria2,数据不受影响)
services:
    pocketdrive:
        image: ghcr.io/lqlcj/pocketdrive:latest
        # build:
        #     context: ..
        #     dockerfile: docker/Dockerfile
        container_name: pocketdrive
        labels:
            com.centurylinklabs.watchtower.enable: "true"
        restart: unless-stopped
        # 让 docker 塞一个 init 进程当 PID 1:yt-dlp 会派生 ffmpeg,
        # 没有 init 时这些孙进程退出后会变成僵尸攒在容器里
        init: true
        ports:
            - '16688:16688'
        environment:
            - POCKETDRIVE_DATA_DIR=/data
            - POCKETDRIVE_DB=/config/pocketdrive.db
            - POCKETDRIVE_ADMIN_USER=${POCKETDRIVE_ADMIN_USER:-admin}
            # 留空则首次启动随机生成并打印在容器日志里
            - POCKETDRIVE_ADMIN_PASSWORD=${POCKETDRIVE_ADMIN_PASSWORD:-}
            - POCKETDRIVE_ARIA2_RPC=http://aria2:6800/jsonrpc
            - POCKETDRIVE_ARIA2_SECRET=${ARIA2_SECRET:-changeme}
            # aria2 进程眼里的数据目录。两个容器必须挂成同一个路径,
            # 否则下载完的文件在网盘里找不到
            - POCKETDRIVE_ARIA2_DATA_DIR=/data
            - POCKETDRIVE_UPDATER_URL=http://pocketdrive-updater:8080
            - POCKETDRIVE_UPDATER_TOKEN=${POCKETDRIVE_UPDATER_TOKEN:?请在.env中设置随机更新密钥}
        volumes:
            - ./data:/data
            - ./config:/config
        depends_on:
            - aria2
        networks:
            - default
            - update-internal

    # 只负责接收已认证的升级请求;不暴露端口,主容器不接触 Docker Socket。
    pocketdrive-updater:
        image: containrrr/watchtower:1.7.1
        container_name: pocketdrive-updater
        labels:
            com.centurylinklabs.watchtower.enable: "false"
        restart: unless-stopped
        command: --http-api-update --http-api-periodic-polls=false --label-enable --cleanup
        environment:
            - WATCHTOWER_HTTP_API_TOKEN=${POCKETDRIVE_UPDATER_TOKEN:?请在.env中设置随机更新密钥}
            - WATCHTOWER_HTTP_API_METRICS=false
            - DOCKER_API_VERSION=1.40
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        networks:
            - update-internal

    aria2:
        image: p3terx/aria2-pro
        container_name: pocketdrive-aria2
        restart: unless-stopped
        environment:
            - RPC_SECRET=${ARIA2_SECRET:-changeme}
            # BT 监听端口(需要在防火墙放行 TCP+UDP,不开也能下载只是慢)
            - LISTEN_PORT=6888
            # 2G VPS 资源限制
            - MAX_CONCURRENT_DOWNLOADS=3
            # 这两行不能删。镜像里 aria2c 固定以 p3terx 用户跑,PUID/PGID
            # 不设时是 65534(nobody);而 PocketDrive 以 root 建目录
            # (root:root 0755),nobody 写不进去 —— 表现为 BT 报
            # "Failed to make the directory ..., cause: Permission denied",
            # 普通直链报 "Download aborted."(aria2 建文件失败时的外层文案)。
            # 两个容器统一用 root,共享 /data 才不会打架。
            - PUID=0
            - PGID=0
            - UMASK_SET=022
        volumes:
            - ./data:/data
            # aria2 自己的配置与会话。挂出来,容器重启/升级后未完成的任务
            # 还能接着下,DHT 路由表也不用重新热身
            - ./config/aria2:/config
        ports:
            - '6888:6888'
            - '6888:6888/udp'

networks:
    update-internal:
        internal: true
