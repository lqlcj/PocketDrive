# PocketDrive 部署：PocketDrive + 项目自维护的原版 aria2 两个容器，
# 共享同一个 /data（整个网盘目录）。
#
# 两种用法:
#   A. 直接用 GHCR 镜像（推荐，VPS 无需编译）：保持 image 行不动
#   B. 本地开发：可把对应服务的 build 注释取消
#
# 使用前:在同目录 .env 中设置 ARIA2_SECRET、POCKETDRIVE_ADMIN_PASSWORD
#
# 以后怎么更新:
#   全部组件      cd 到本目录,docker compose pull && docker compose up -d
#                 (会更新 PocketDrive、ffmpeg 和 aria2,数据不受影响)
services:
    pocketdrive:
        image: ghcr.io/lqlcj/pocketdrive:latest
        # build:
        #     context: ..
        #     dockerfile: docker/Dockerfile
        container_name: pocketdrive
        restart: unless-stopped
        # 让 docker 塞一个 init 进程当 PID 1:后台任务可能派生子进程,
        # 没有 init 时这些孙进程退出后会变成僵尸攒在容器里
        init: true
        ports:
            - '16688:16688'
        environment:
            - POCKETDRIVE_DATA_DIR=/data
            - POCKETDRIVE_DB=/config/pocketdrive.db
            - POCKETDRIVE_ADMIN_USER=${POCKETDRIVE_ADMIN_USER:-admin}
            # 留空则首次启动随机生成并打印在容器日志里
            - POCKETDRIVE_ADMIN_PASSWORD=${POCKETDRIVE_ADMIN_PASSWORD:-}
            - POCKETDRIVE_ARIA2_RPC=http://aria2:6800/jsonrpc
            - POCKETDRIVE_ARIA2_SECRET=${ARIA2_SECRET:?请设置随机的 ARIA2_SECRET}
            # aria2 进程眼里的数据目录。两个容器必须挂成同一个路径,
            # 否则下载完的文件在网盘里找不到
            - POCKETDRIVE_ARIA2_DATA_DIR=/data
        volumes:
            - ./data:/data
            - ./config:/config
        depends_on:
            aria2:
                condition: service_healthy
    aria2:
        # 原版 aria2 来自 Alpine 官方 community 包。这个镜像由本项目每周
        # 自动重建并跑 RPC + HTTPS 实际下载测试，不依赖第三方魔改镜像。
        image: ${POCKETDRIVE_ARIA2_IMAGE:-ghcr.io/lqlcj/pocketdrive:aria2-latest}
        # build:
        #     context: ..
        #     dockerfile: docker/Dockerfile.aria2
        container_name: pocketdrive-aria2
        restart: unless-stopped
        stop_grace_period: 30s
        environment:
            - RPC_SECRET=${ARIA2_SECRET:?请设置随机的 ARIA2_SECRET}
            # BT 监听端口（需要在防火墙放行 TCP+UDP，不开也能下载但冷门资源更慢）
            - LISTEN_PORT=6888
            # 启动默认值；PocketDrive 启动后会把网页中的设置通过 RPC 覆盖上去。
            - MAX_CONCURRENT_DOWNLOADS=3
            - BT_MAX_PEERS=${ARIA2_BT_MAX_PEERS:-55}
            - DISK_CACHE=${ARIA2_DISK_CACHE:-64M}
            - ENABLE_DHT6=${ARIA2_ENABLE_DHT6:-false}
            - UMASK_SET=022
            - TZ=${TZ:-Asia/Shanghai}
        volumes:
            - ./data:/data
            # 沿用旧版的目录和标准文件名 aria2.session / dht.dat / dht6.dat，
            # 从 p3terx 镜像升级时未完成任务和 DHT 路由表可以继续使用。
            - ./config/aria2:/config
        ports:
            - '6888:6888'
            - '6888:6888/udp'
