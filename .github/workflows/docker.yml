# 推送到 main 或打 v* tag 时，构建 PocketDrive 多架构镜像。
name: docker

# 防止手动运行和 main 推送同时覆盖 latest。
concurrency:
    group: pocketdrive-docker-publish-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta-app
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/pocketdrive
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}}
                      type=sha,format=short,prefix=sha-

            - name: Publish PocketDrive image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  pull: true
                  tags: ${{ steps.meta-app.outputs.tags }}
                  labels: ${{ steps.meta-app.outputs.labels }}
                  cache-from: type=gha,scope=pocketdrive
                  cache-to: type=gha,mode=max,scope=pocketdrive
