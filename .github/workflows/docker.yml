# 推送到 main 或打 v* tag 时，构建 PocketDrive 多架构镜像。
name: docker

# 防止手动运行和 main 推送同时覆盖 latest。
concurrency:
    group: pocketdrive-docker-publish-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:
    pull_request:
        paths:
            - 'docker/**'
            - 'scripts/aria2-smoke.mjs'
            - 'scripts/install.sh'
            - '.github/workflows/docker.yml'
    schedule:
        - cron: '23 4 * * 1'

jobs:
    aria2:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - name: Build and test aria2
              run: |
                  docker build --pull -f docker/aria2/Dockerfile -t pocketdrive-aria2:test .
                  node scripts/aria2-smoke.mjs
                  ARIA2_SECRET=ci-validation-only docker compose -f docker/docker-compose.yml config --quiet
                  bash -n scripts/install.sh
                  sh -n docker/aria2/entrypoint.sh
            - uses: docker/login-action@v3
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/pocketdrive-aria2
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}}
                      type=sha,format=short,prefix=sha-
                      type=schedule,pattern={{date 'YYYYMMDD'}}
            - name: Publish aria2 image
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/aria2/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  pull: true
                  no-cache: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
    build:
        needs: aria2
        if: github.event_name != 'pull_request' && github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta-app
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/pocketdrive
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}}
                      type=sha,format=short,prefix=sha-

            - name: Publish PocketDrive image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  pull: true
                  tags: ${{ steps.meta-app.outputs.tags }}
                  labels: ${{ steps.meta-app.outputs.labels }}
                  cache-from: type=gha,scope=pocketdrive
                  cache-to: type=gha,mode=max,scope=pocketdrive
